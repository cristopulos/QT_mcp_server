[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qt-mcp"
version = "0.3.0"
description = "MCP server for interacting with Qt applications via screenshots and basic filesystem operations (cross-platform: Linux/X11 and Windows)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cristopulos" }]
keywords = ["mcp", "qt", "screenshot", "filesystem", "model-context-protocol"]
dependencies = [
    "mcp>=1.28.1,<2",
    "mss>=9.0.0",
    "pillow>=10.0.0",
]

[project.scripts]
qt-mcp = "qt_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qt_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/qt_mcp" = "qt_mcp"

[tool.pytest.ini_options]
testpaths = ["tests"]